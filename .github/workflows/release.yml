name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Build x86_64
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Combine into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/sessync \
            target/x86_64-apple-darwin/release/sessync \
            target/aarch64-apple-darwin/release/sessync
          chmod +x dist/sessync
          file dist/sessync

      - name: Codesign (ad-hoc)
        run: codesign --force --sign - dist/sessync

      - name: Package + checksum
        id: package
        run: |
          cd dist
          ARCHIVE="sessync-${{ github.ref_name }}-macos-universal.tar.gz"
          tar czf "$ARCHIVE" sessync
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sessync-${{ github.ref_name }}-macos-universal.tar.gz
            dist/sessync-${{ github.ref_name }}-macos-universal.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Bump homebrew-sessync formula
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/sessync-${{ github.ref_name }}-macos-universal.tar.gz"
          SHA=$(awk '{print $1}' "${ARCHIVE}.sha256")
          echo "Updating tap to version=$VERSION sha256=$SHA"

          gh repo clone echobyte26/homebrew-sessync /tmp/tap
          cd /tmp/tap
          git config user.name "sessync-release-bot"
          git config user.email "noreply@github.com"

          # macOS BSD sed (runner is macos-latest).
          sed -i '' "s|version \".*\"|version \"$VERSION\"|" Formula/sessync.rb
          sed -i '' "s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/sessync.rb

          if git diff --quiet Formula/sessync.rb; then
            echo "Formula already up to date — nothing to push"
            exit 0
          fi

          git add Formula/sessync.rb
          git commit -m "Bump sessync to v$VERSION (auto)"
          git push
