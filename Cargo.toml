[package]
name = "sessync"
version = "0.2.3"
edition = "2021"
rust-version = "1.75"
authors = ["Echobyte"]
license = "MIT"
description = "Cross-device sync for Claude Code agent sessions, with client-side encryption"
homepage = "https://github.com/echobyte26/sessync"
repository = "https://github.com/echobyte26/sessync"
readme = "README.md"
keywords = ["claude", "sync", "agent", "encryption", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
age = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native"] }
dialoguer = "0.11"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
machine-uid = "0.5"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
aliyun-oss-client = "0.13"
serde-xml-rs = "0.6"
owo-colors = "4"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "test-util"] }
