[package]
name = "sessync"
version = "0.10.0"
edition = "2021"
rust-version = "1.75"
authors = ["Echobyte"]
license = "MIT"
description = "Cross-device sync for Claude Code agent sessions, with client-side encryption"
homepage = "https://github.com/echobyte26/sessync"
repository = "https://github.com/echobyte26/sessync"
readme = "README.md"
keywords = ["claude", "sync", "agent", "encryption", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
age = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
machine-uid = "0.5"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
aliyun-oss-client = "0.13"
serde-xml-rs = "0.6"
# S3-compatible storage adapter (MinIO, Cloudflare R2, Backblaze B2, AWS S3).
# rust-s3 chosen over aws-sdk-s3 for its smaller dependency footprint and
# built-in path-style vs virtual-hosted-style URL support (MinIO needs path-style).
# tokio-rustls-tls avoids linking against platform native-tls (openssl / Security.framework).
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
owo-colors = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
# Preserve source session's mtime on write_session so the receiver's next sync
# doesn't see a phantom "newer than remote" file and trigger a re-upload loop.
# Root cause of the v0.8.x 14 GB/day bandwidth bleed; see CHANGELOG v0.8.2.
filetime = "0.2"
# gzip jsonl before encrypt — 5-10x bandwidth reduction for textual session
# logs. See CHANGELOG v0.9.0. Use flate2 over miniz_oxide because flate2 has
# better compatibility with macOS system zlib (already present, no extra link).
flate2 = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "test-util"] }
